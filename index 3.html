button.x{background:var(--btnx)}button.g{background:var(--muted)}

.sheet.on{display:flex}

.sheet h2{font-size:11px;margin:0 0 14px}
.seed{display:flex;align-items:center;gap:10px;padding:8px;margin:0 4px 16px;background:var(--bg);box-shadow:0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink)}

.seed .in{flex:1;font-size:7px;line-height:1.9}
.row{display:flex;gap:10px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.reset{margin:26px auto 0;display:flex}

#sc{position:fixed;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.bfl{position:absolute;left:-40px;animation:fly 26s steps(130) infinite}
.bfl svg{width:30px;height:30px;animation:flap .5s steps(1) infinite}
@keyframes fly{to{transform:translateX(calc(100vw + 80px))}}
@keyframes flap{0%{transform:translateY(0) scaleX(1)}50%{transform:translateY(-6px) scaleX(.55)}}
.cld{position:absolute;left:-90px;animation:fly 80s steps(200) infinite;opacity:.4}
.cld svg{width:72px;height:72px}
#ld{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;transition:opacity .4s steps(4)}
#ld.off{opacity:0;pointer-events:none}
.ldt{font-size:18px;line-height:1.7;text-align:center;color:#fff;text-shadow:3px 3px 0 var(--ink),-1px -1px 0 var(--ink),1px -1px 0 var(--ink),-1px 1px 0 var(--ink)}
.lawn{position:relative;width:min(300px,80vw);height:60px;background:linear-gradient(#2f7d2a,#2f7d2a) 0 100%/100% 12px no-repeat,repeating-linear-gradient(90deg,#5fcf4f 0 4px,transparent 4px 8px) 0 100%/100% 28px no-repeat,repeating-linear-gradient(90deg,#3f9e35 0 4px,transparent 4px 12px) 4px 100%/100% 46px no-repeat}
.cut{position:absolute;left:0;bottom:0;height:100%;width:0;background:linear-gradient(#2f7d2a,#2f7d2a) 0 100%/100% 12px no-repeat,repeating-linear-gradient(90deg,#8be874 0 8px,#6fd35c 8px 16px) 0 100%/100% 16px no-repeat,var(--bg)}
.mw{position:absolute;bottom:2px;left:0;width:56px;height:56px}
.mw svg{width:56px;height:56px;filter:var(--ol)}
.mw i{position:absolute;right:-2px;bottom:22px;width:4px;height:4px;background:#8be874;animation:cp .5s steps(4) infinite}
@keyframes cp{to{transform:translate(16px,-20px);opacity:0}}
#lp{font-size:9px;color:#fff;text-shadow:2px 2px 0 var(--ink)}
.top{position:static!important;padding:6px 0 6px}
.top::before{display:none!important}
.cbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding:2px 0 12px}
.top2{padding:0 0 4px}
.tabs{flex-wrap:wrap}

.bed3.lk{filter:grayscale(.7) brightness(.8)}
.bed3 .dr{top:20px}
.plot:not(.dry) .bed3 svg.spr{animation:bob 1.4s steps(1) infinite}
.plot.pop .bed3 svg.spr{animation:hop .25s steps(3)}
.ck{display:flex;align-items:center;gap:12px;font-size:8px;cursor:pointer;margin:8px 4px;position:relative}
.ck input{position:absolute;opacity:0;width:0;height:0;margin:0;box-shadow:none}
.ck span{width:16px;height:16px;background:var(--bg);box-shadow:0 0 0 3px var(--ink);display:inline-block;flex:none}
.ck input:checked+span{background:var(--btn);box-shadow:0 0 0 3px var(--ink),inset 0 0 0 3px var(--bg)}

@keyframes rn{to{background-position:-12px 48px}}
.w-storm{background-color:rgba(10,10,60,.28)}

@keyframes sn{50%{opacity:.7}}

function sessSave(rem){if(!SESS)return;try{var t=JSON.stringify({at:SESS.at,rt:SESS.rt,exp:SESS.exp,uid:SESS.uid,l:ME});localStorage.removeItem("ff_s2");sessionStorage.removeItem("ff_s2");(rem?localStorage:sessionStorage).setItem("ff_s2",t)}catch(e){}}
function tok(){if(!SESS)return Promise.reject();if(Date.now()/1000<SESS.exp)return Promise.resolve(SESS.at);
 return api("/auth/v1/token?grant_type=refresh_token",{m:"POST",b:{refresh_token:SESS.rt}}).then(function(r){if(!r.ok||!r.j||!r.j.access_token)throw 0;setSess(r.j);sessSave(!!localStorage.getItem("ff_s2"));return SESS.at})}
function cloudPush(ka){if(!SESS||!ME||!US[ME])return Promise.resolve();dirty=false;
 return tok().then(function(t){return api("/rest/v1/saves?on_conflict=user_id",{m:"POST",tok:t,ka:ka,prefer:"resolution=merge-duplicates,return=minimal",b:{user_id:SESS.uid,nick:US[ME].nick,data:{S:S,av:US[ME].av},updated_at:new Date().toISOString()}})}).then(function(r){if(!r.ok)dirty=true}).catch(function(){dirty=true})}
function sched(){dirty=true;if(ctimer)return;ctimer=setTimeout(function(){ctimer=null;if(dirty)cloudPush()},6000)}
function save(){if(!KEY)return;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}sched()}
function usave(){try{localStorage.setItem("ff_users",JSON.stringify(US))}catch(e){}sched()}
window.addEventListener("pagehide",function(){if(dirty)cloudPush(true)});
document.addEventListener("visibilitychange",function(){if(document.hidden&&dirty)cloudPush(true)});
function norm(o){if(!o||!o.plots||o.plots.length!==6)return fresh();o.gems=o.gems||0;o.inv=o.inv||{};o.buff=o.buff||null;o.lv=o.lv||1;o.xp=o.xp||0;o.rb=o.rb||0;o.pets=o.pets||{};o.eq=o.eq||[];return o}
function signup(l,p,n,i){i=i||0;return api("/auth/v1/signup",{m:"POST",b:{email:mail(l,i),password:p,data:{nick:n}}}).then(function(r){
 if(r.ok&&r.j&&r.j.access_token){setSess(r.j);return}
 var c=((r.j&&(r.j.error_code||r.j.code||""))+" "+(r.j&&(r.j.msg||r.j.message)||"")).toLowerCase();
 if(/exists|registered/.test(c))throw"Такой ник уже занят";
 if(/weak|password/.test(c))throw"Пароль слишком простой";
 if(/email_address_invalid|invalid/.test(c)&&i<DOMS.length-1)return signup(l,p,n,i+1);
 if(r.ok&&r.j&&r.j.user)throw"В Supabase включено подтверждение почты. Выключите Confirm email";
 throw"Ошибка регистрации: "+c.trim()})}
function login(l,p,i){i=i||0;return api("/auth/v1/token?grant_type=password",{m:"POST",b:{email:mail(l,i),password:p}}).then(function(r){
 if(r.ok&&r.j&&r.j.access_token){setSess(r.j);return}
 if(i<DOMS.length-1)return login(l,p,i+1);
 throw"Неверный ник или пароль"})}
function doAuth(reg){var rem=$("rm").checked,n=$("an").value.trim(),p=$("ap").value,l=n.toLowerCase(),m=$("am");
 if(!NICK.test(n)){m.textContent="Ник: 3–12 букв, цифр или _";return}
 if(p.length<6){m.textContent="Пароль: минимум 6 символов";return}
 m.textContent="Подождите…";
 (reg?signup(l,p,n):login(l,p)).then(function(){startGame(l,rem,n)}).catch(function(e){m.textContent=typeof e==="string"?e:"Ошибка: "+((e&&e.message)||e)})}
function startGame(l,rem,nick0){ME=l;KEY="ff_save_"+l;
 var fin=function(){$("auth").classList.remove("on");_ak="";sessSave(rem);try{if(rem)localStorage.setItem("ff_last",l);else localStorage.removeItem("ff_last")}catch(e){}build();pfui();toast("Привет, "+US[l].nick+"!")};
 tok().then(function(t){return api("/rest/v1/saves?select=nick,data&user_id=eq."+SESS.uid,{tok:t})}).then(function(r){
  var row=r.ok&&r.j&&r.j[0];
  if(row&&row.data&&row.data.S){S=norm(row.data.S);US[l]={nick:row.nick||nick0||l,av:row.data.av||{t:"p",v:"avm"}}}
  else{loadSave(KEY);US[l]={nick:nick0||l,av:{t:"p",v:"avm"}};sched()}
  fin()}).catch(function(){loadSave(KEY);US[l]=US[l]||{nick:nick0||l,av:{t:"p",v:"avm"}};fin()})}
function boot(){var raw=null;try{raw=sessionStorage.getItem("ff_s2")||localStorage.getItem("ff_s2")}catch(e){}
 if(raw){try{var s0=JSON.parse(raw),l=s0.l,rem=!!localStorage.getItem("ff_s2");SESS={at:s0.at,rt:s0.rt,exp:s0.exp,uid:s0.uid};ME=l;
  tok().then(function(){startGame(l,rem,null)}).catch(function(){ME=null;SESS=null;build();showAuth("Сессия истекла, войдите снова")});return}catch(e){}}
 build();showAuth()}
function logout(){save();var done=function(){try{localStorage.removeItem("ff_s2");sessionStorage.removeItem("ff_s2")}catch(e){}SESS=null;ME=null;KEY="";closeS();S=fresh();build();showAuth()};cloudPush().then(done,done)}
function nickView(){var u=US[ME];
 open('<h2>Новый ник</h2><input id="nn" maxlength="12" value="'+u.nick+'"><div class="hint" style="line-height:1.9;margin:4px 0">Это имя в профиле. Входить нужно по нику регистрации: '+ME+'</div><div id="nm2" class="hint" style="min-height:20px;color:var(--btnx)"></div><div class="row"><button class="g" id="back">Назад</button><button id="ns">Сохранить</button></div>');
 $("back").onclick=showProfile;
 $("ns").onclick=function(){var n=$("nn").value.trim(),m=$("nm2");if(!NICK.test(n)){m.textContent="Ник: 3–12 букв, цифр или _";return}u.nick=n;usave();pfui();showProfile()}}
function showAuth(m){$("auth").classList.add("on");
 $("abox").innerHTML='<h2 style="text-align:center;font-size:12px">ЦВЕТУЩАЯ ФЕРМА</h2><div style="text-align:center;margin:8px 0">'+svg("sun")+'</div><input id="an" placeholder="Ник" maxlength="12" autocomplete="username"><input id="ap" type="password" placeholder="Пароль (от 6 символов)" autocomplete="current-password"><label class="ck"><input type="checkbox" id="rm" checked><span></span>Запомнить меня</label><div id="am" class="hint" style="min-height:22px;color:var(--btnx)">'+(m||"")+'</div><div class="row"><button id="al">Войти</button><button id="ar" class="g">Создать</button></div><div class="hint" style="text-align:center;margin-top:12px;line-height:1.8">Аккаунт работает на любом устройстве</div>';
 try{var lt=localStorage.getItem("ff_last");if(lt)$("an").value=lt}catch(e){}
 $("al").onclick=function(){doAuth(0)};$("ar").onclick=function(){doAuth(1)}}
boot();
</script>
